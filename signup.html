{% extends "base.html" %}
{% block subhead %}Open an account to start receiving dispatches.{% endblock %}
{% block content %}

<div class="card">
  <div class="field-label">New account</div>

  <form method="POST">
    <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
    <input type="password" name="password" placeholder="Choose a password (6+ characters)" required autocomplete="new-password">
    <button type="submit">Open Account &#9656;</button>
  </form>

  {% if error %}
    <div class="error-box">{{ error }}</div>
  {% endif %}

  <div class="switch-line">Already have an account? <a href="{{ url_for('login') }}">Log in here</a></div>
</div>

{% endblock %}
